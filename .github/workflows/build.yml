name: Build engines

on:
  workflow_dispatch:
    inputs:
      version:
        description: CrossOver source version
        required: true
        type: choice
        options:
          - 24.0.7
          - 25.1.1
      publish_release:
        description: Publish a GitHub Release (requires approved redistribution)
        required: true
        default: false
        type: boolean
      upload_engine_artifacts:
        description: Upload compiled engine archives (private repositories only)
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: engine-${{ inputs.version }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            runner: ubuntu-24.04
          - target: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject public binary artifact uploads
        if: inputs.upload_engine_artifacts && !github.event.repository.private && !inputs.publish_release
        run: |
          printf 'compiled engine artifacts may only be uploaded by a private repository or an approved release\n' >&2
          exit 1

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bison build-essential flex gcc-multilib g++-multilib \
            jq libfreetype-dev libgnutls28-dev libx11-dev \
            libxext-dev libxrender-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev pkg-config python3
          dpkg-query --show > dependency-versions.txt

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew update-reset
          brew install bison freetype gnutls jq llvm mingw-w64 pkg-config
          test -x "$(brew --prefix llvm)/bin/llvm-ar"
          test -x "$(brew --prefix llvm)/bin/llvm-ranlib"
          brew list --versions > dependency-versions.txt

      - name: Build and package runtime
        env:
          WINEFORGE_JOBS: "3"
        run: ./scripts/build-engine.sh "${{ inputs.version }}" "${{ matrix.target }}"

      - name: Add dependency inventory to build evidence
        run: |
          cp dependency-versions.txt dist/dependency-versions-${{ matrix.target }}.txt

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: work/${{ inputs.version }}-${{ matrix.target }}/stage
          format: spdx-json
          output-file: dist/wineforge-engine-${{ inputs.version }}-${{ matrix.target }}.spdx.json
          upload-artifact: false

      - name: Attest runtime provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/wineforge-engine-${{ inputs.version }}-${{ matrix.target }}.tar.gz

      - name: Attest runtime SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/wineforge-engine-${{ inputs.version }}-${{ matrix.target }}.tar.gz
          sbom-path: dist/wineforge-engine-${{ inputs.version }}-${{ matrix.target }}.spdx.json

      - name: Upload reference evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-reference-${{ inputs.version }}-${{ matrix.target }}
          path: |
            dist/wineforge-engine-${{ inputs.version }}-${{ matrix.target }}.tar.gz.sha256
            dist/wineforge-engine-${{ inputs.version }}-${{ matrix.target }}.spdx.json
            dist/wineforge-engine-${{ inputs.version }}-${{ matrix.target }}.tar.gz.runtime.json
            dist/wineforge-engine-${{ inputs.version }}-${{ matrix.target }}.reference.json
            dist/dependency-versions-${{ matrix.target }}.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload compiled engine
        if: (inputs.upload_engine_artifacts && github.event.repository.private) || inputs.publish_release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engine-binary-${{ inputs.version }}-${{ matrix.target }}
          path: dist/wineforge-engine-${{ inputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  release:
    if: inputs.publish_release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce redistribution approval
        run: ./scripts/check-redistribution.sh "${{ inputs.version }}"

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: engine-*-${{ inputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: engine-${{ inputs.version }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'release tag already exists; releases are immutable: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            printf 'git tag already exists; refusing ambiguous publication: %s\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" release-assets/* \
            --generate-notes \
            --title "Wineforge engine ${{ inputs.version }}" \
            --target "$GITHUB_SHA"
